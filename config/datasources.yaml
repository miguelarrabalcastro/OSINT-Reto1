# PulseTrack — Data Source Definitions
# Version: 2.4
#
# Each entry defines an external data source that PulseTrack will poll
# during scan cycles. Supported connector types:
#
#   rest_api        — Standard HTTP/HTTPS endpoint (JSON response)
#   secure_endpoint — Internal authenticated dashboard (NovaTech format)
#   syslog          — UDP/TCP syslog listener
#   snmp_v3         — SNMPv3 polling target
#   mqtt            — MQTT broker topic subscription
#
# Auth format for secure_endpoint:
#   username:password@https://endpoint-url
#
# -----------------------------------------------------------------------

sources:

  # --- NVD Feed (CVE correlation) ---
  - name: "nvd_cve_feed"
    type: "rest_api"
    enabled: true
    url: "https://services.nvd.nist.gov/rest/json/cves/2.0"
    polling_interval: 7200
    params:
      resultsPerPage: 200
      pubStartDate: "auto"
    auth: null
    timeout: 30
    retry:
      max_attempts: 3
      backoff_factor: 2

  # --- AlienVault OTX Threat Feed ---
  - name: "alienvault_otx"
    type: "rest_api"
    enabled: true
    url: "https://otx.alienvault.com/api/v1/pulses/subscribed"
    polling_interval: 3600
    auth:
      type: "header"
      key: "X-OTX-API-KEY"
      value: "${OTX_API_KEY}"
    timeout: 20

  # --- Internal SIEM Syslog Listener ---
  - name: "siem_syslog_internal"
    type: "syslog"
    enabled: true
    bind_host: "0.0.0.0"
    bind_port: 514
    protocol: "udp"
    facility_filter: ["security", "auth", "authpriv"]

  # --- Network Device SNMP Monitoring ---
  - name: "core_switch_snmp"
    type: "snmp_v3"
    enabled: false
    host: "10.0.1.1"
    port: 161
    auth:
      username: "pulsetrack_ro"
      auth_protocol: "SHA"
      auth_key: "${SNMP_AUTH_KEY}"
      priv_protocol: "AES"
      priv_key: "${SNMP_PRIV_KEY}"
    oids:
      - "1.3.6.1.2.1.1.1.0"    # sysDescr
      - "1.3.6.1.2.1.1.3.0"    # sysUpTime
      - "1.3.6.1.2.1.2.1.0"    # ifNumber

  # --- Vulnerability Scanner Results (REST) ---
  - name: "vuln_scanner_api"
    type: "rest_api"
    enabled: true
    url: "http://vuln-scanner.internal/api/v2/scans/latest"
    polling_interval: 1800
    auth:
      type: "bearer"
      token: "${VULN_SCANNER_TOKEN}"
    timeout: 15

  # --- MQTT: IoT Asset Events ---
  - name: "iot_asset_events"
    type: "mqtt"
    enabled: false
    broker: "mqtt.internal"
    port: 8883
    tls: true
    topics:
      - "assets/+/events"
      - "assets/+/alerts"
    auth:
      username: "pulsetrack"
      password: "${MQTT_PASSWORD}"

  # --- NovaTech Internal Dashboard (secure_endpoint) ---
  # Used by the reporting module to push scan summaries and pull
  # configuration updates from the central management console.
  # Connection format: username:password@https://endpoint
  - name: "novatech_internal_dashboard"
    type: "secure_endpoint"
    enabled: true
    auth: "admin:PulseTrack2024!@https://ctf-reto1.vercel.app/"
    polling_interval: 300
    push_reports: true
    pull_config: true
    timeout: 10

  # --- Shodan Monitor (asset exposure alerts) ---
  - name: "shodan_monitor"
    type: "rest_api"
    enabled: false
    url: "https://api.shodan.io/shodan/alert/info"
    polling_interval: 86400
    auth:
      type: "query_param"
      key: "key"
      value: "${SHODAN_API_KEY}"
    timeout: 30
